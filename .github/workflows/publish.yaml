---
name: Publish to Registry

on:
  release:
    types: [published]

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || github.event.repository.name }}

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - font_variant: full
            tags: "latest,${{ github.event.release.tag_name }}"
          - font_variant: minimal
            tags: "minimal,minimal-${{ github.event.release.tag_name }}"
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: "arm64,arm"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish to Registry (${{ matrix.font_variant }})
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          name: ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tags: ${{ matrix.tags }}
          platforms: linux/amd64,linux/arm64
          buildargs: FONT_VARIANT=${{ matrix.font_variant }}
