# ============================================================================
# Upstream Sync Workflow — Weekly Sync with rlespinasse/drawio-desktop-headless
# ============================================================================
# Runs:
#   - Every Sunday at 08:00 UTC (weekly)
#   - Manual trigger (workflow_dispatch)
#
# Actions:
#   1. Fetch upstream changes
#   2. Run upstream_sync.sh script
#   3. If new commits found, create an automated PR
#   4. Run tests on the merge result
# ============================================================================

name: Upstream Sync

on:
  schedule:
    # Every Sunday at 08:00 UTC
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: "Upstream branch to sync from"
        type: string
        default: "main"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    name: "Sync with Upstream"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Full history for merge

      - name: Set upstream remote
        run: |
          UPSTREAM_BRANCH="${{ inputs.upstream_branch || 'main' }}"
          git remote add upstream https://github.com/rlespinasse/drawio-desktop-headless.git
          git fetch upstream "$UPSTREAM_BRANCH"
          echo "Upstream branch: $UPSTREAM_BRANCH"
          echo "Upstream HEAD: $(git rev-parse upstream/$UPSTREAM_BRANCH)"

      - name: Check for new upstream commits
        id: check_commits
        run: |
          UPSTREAM_BRANCH="${{ inputs.upstream_branch || 'main' }}"
          LOCAL_HEAD=$(git rev-parse HEAD)
          UPSTREAM_HEAD=$(git rev-parse upstream/$UPSTREAM_BRANCH)

          echo "Local HEAD:  $LOCAL_HEAD"
          echo "Upstream HEAD: $UPSTREAM_HEAD"

          if [ "$LOCAL_HEAD" = "$UPSTREAM_HEAD" ]; then
            echo "synced=true" >> $GITHUB_OUTPUT
            echo "has_new_commits=false" >> $GITHUB_OUTPUT
            echo "✅ Already up to date with upstream"
          else
            echo "synced=false" >> $GITHUB_OUTPUT
            echo "has_new_commits=true" >> $GITHUB_OUTPUT
            echo "📊 New upstream commits found:"
            git log --oneline HEAD..upstream/$UPSTREAM_BRANCH
          fi

      - name: Set up Python (for tests post-merge)
        if: steps.check_commits.outputs.has_new_commits == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        if: steps.check_commits.outputs.has_new_commits == 'true'
        run: |
          pip install --upgrade pip
          pip install "pytest>=8.2" "pytest-asyncio>=0.21" "httpx>=0.27"
          pip install fastapi uvicorn arq redis lxml boto3 pydantic pydantic-settings python-dotenv

      - name: Create sync branch
        id: create_branch
        if: steps.check_commits.outputs.has_new_commits == 'true'
        run: |
          BRANCH_NAME="automated/upstream-sync-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Created branch: $BRANCH_NAME"

      - name: Merge upstream
        if: steps.check_commits.outputs.has_new_commits == 'true'
        id: merge
        run: |
          UPSTREAM_BRANCH="${{ inputs.upstream_branch || 'main' }}"
          if git merge "upstream/$UPSTREAM_BRANCH" --no-edit --strategy-option theirs; then
            echo "merge_success=true" >> $GITHUB_OUTPUT
            echo "✅ Merge successful"
          else
            echo "merge_success=false" >> $GITHUB_OUTPUT
            echo "❌ Merge conflicts detected"
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U
          fi
        continue-on-error: true

      - name: Run tests on merged code
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.merge.outputs.merge_success == 'true'
        run: |
          pytest tests/ -v --tb=short -m "not integration and not slow" || echo "⚠️ Some tests failed — manual review may be needed"

      - name: Commit merge
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.merge.outputs.merge_success == 'true'
        run: |
          UPSTREAM_BRANCH="${{ inputs.upstream_branch || 'main' }}"
          UPSTREAM_HEAD=$(git rev-parse upstream/$UPSTREAM_BRANCH)
          git add -A
          git diff --cached --quiet || git commit -m "chore(upstream): sync with upstream/main

          Automated upstream sync from rlespinasse/drawio-desktop-headless.

          Upstream commit: ${UPSTREAM_HEAD}
          Date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          Generated by: .github/workflows/upstream-sync.yml"

      - name: Push sync branch
        if: steps.check_commits.outputs.has_new_commits == 'true'
        run: |
          git push origin "${{ steps.create_branch.outputs.branch_name }}" --force

      - name: Create Pull Request
        if: steps.check_commits.outputs.has_new_commits == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "${{ steps.create_branch.outputs.branch_name }}"
          base: "main"
          title: "chore(upstream): sync with rlespinasse/drawio-desktop-headless"
          body: |
            ## 🔄 Automated Upstream Sync

            This PR syncs changes from the upstream repository [rlespinasse/drawio-desktop-headless](https://github.com/rlespinasse/drawio-desktop-headless).

            **Trigger:** Weekly cron job (Sunday 08:00 UTC) or manual dispatch

            **Merge Status:** ${{ steps.merge.outputs.merge_success == 'true' && '✅ Successful' || '❌ Has Conflicts' }}

            ### What was synced
            - Docker image improvements from upstream
            - Draw.io Desktop updates
            - Security patches
            - Bug fixes in the base headless rendering

            ### Review Checklist
            - [ ] Verify that our fork-specific features still work (API, ARQ, compliance)
            - [ ] Test Docker build: `docker compose -f docker/docker-compose.yml build`
            - [ ] Run test suite: `pytest tests/`
            - [ ] Check for breaking changes in draw.io CLI interface
            - [ ] Update NOTICE if new dependencies were added

            ### Post-Merge
            After merging, tag a new release if significant upstream changes are included:
            ```bash
            git tag v$(cat pyproject.toml | grep version | head -1 | cut -d'"' -f2)
            git push --tags
            ```

            ---
            *Generated by [upstream-sync workflow](.github/workflows/upstream-sync.yml)*
          labels: |
            automated
            upstream
            sync
          delete-branch: true
          reviewers: |
            ${{ github.repository_owner }}
          assignees: |
            ${{ github.repository_owner }}

      - name: Handle merge conflicts
        if: steps.check_commits.outputs.has_new_commits == 'true' && steps.merge.outputs.merge_success != 'true'
        run: |
          echo "::warning::⚠️ Merge conflicts detected with upstream!"
          echo ""
          echo "Conflicting files:"
          git diff --name-only --diff-filter=U
          echo ""
          echo "Manual resolution is required. The sync branch has been pushed."
          echo "Please resolve conflicts and create a PR manually."