name: Sync v1.x Into Main

on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Base branch to sync from"
        required: true
        default: "v1.x"
      target_branch:
        description: "Target branch to update"
        required: true
        default: "main"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-base-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch source and target branches
        run: |
          SOURCE_BRANCH="${{ inputs.source_branch || 'v1.x' }}"
          TARGET_BRANCH="${{ inputs.target_branch || 'main' }}"
          git fetch origin "$SOURCE_BRANCH" "$TARGET_BRANCH"
          echo "SOURCE_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

      - name: Check if sync is needed
        id: sync_check
        run: |
          COMMITS_AHEAD=$(git rev-list --count "origin/${TARGET_BRANCH}..origin/${SOURCE_BRANCH}")
          echo "commits_ahead=$COMMITS_AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$COMMITS_AHEAD" -eq 0 ]; then
            echo "No sync required"
          else
            echo "Sync required: $COMMITS_AHEAD commit(s) ahead"
          fi

      - name: Prepare sync branch
        if: steps.sync_check.outputs.commits_ahead != '0'
        run: |
          SYNC_BRANCH="automated/sync-${SOURCE_BRANCH}-into-${TARGET_BRANCH}-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$SYNC_BRANCH" "origin/${TARGET_BRANCH}"
          git merge --no-ff --no-commit "origin/${SOURCE_BRANCH}"
          echo "SYNC_BRANCH=$SYNC_BRANCH" >> "$GITHUB_ENV"

      - name: Set up Python
        if: steps.sync_check.outputs.commits_ahead != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.sync_check.outputs.commits_ahead != '0'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -r api/requirements.txt -r worker/requirements.txt

      - name: Run platform validation
        if: steps.sync_check.outputs.commits_ahead != '0'
        run: |
          pytest tests/test_linting.py tests/test_stencils_loader.py tests/test_api.py -v --tb=short
          docker compose -f docker/docker-compose.yml config > /dev/null

      - name: Create pull request
        if: steps.sync_check.outputs.commits_ahead != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.SYNC_BRANCH }}
          base: ${{ env.TARGET_BRANCH }}
          commit-message: "chore(sync): merge ${{ env.SOURCE_BRANCH }} into ${{ env.TARGET_BRANCH }}"
          title: "chore(sync): merge ${{ env.SOURCE_BRANCH }} into ${{ env.TARGET_BRANCH }}"
          body: |
            This PR syncs the current runtime base branch into the integrated main branch.

            Validation included:
            - Python platform tests
            - docker compose config parsing

            Review focus:
            - upstream runtime changes that affect the automation layer
            - Docker/runtime compatibility
            - CI or release side effects
          delete-branch: true
