# ============================================================================
# Release Workflow — Build, Push to GHCR, Generate SBOM
# ============================================================================
# Triggers:
#   - Tag push matching v* (e.g., v0.1.0, v1.2.3)
#
# Actions:
#   1. Run tests on the tag
#   2. Build multi-arch Docker images (linux/amd64, linux/arm64)
#   3. Push to GitHub Container Registry (ghcr.io)
#   4. Generate SBOM (Software Bill of Materials) with anchore/syft
# ============================================================================

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"  # Pre-releases (v1.0.0-alpha)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.0)"
        required: true

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository }}-api
  WORKER_IMAGE_NAME: ${{ github.repository }}-worker

jobs:
  # =========================================================================
  # Tests — Run test suite before releasing
  # =========================================================================
  test:
    name: "Pre-release Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "pytest>=8.2" "pytest-asyncio>=0.21" "pytest-cov>=5.0" "pytest-mock>=3.14" "httpx>=0.27"
          pip install fastapi uvicorn arq redis lxml boto3 pydantic pydantic-settings python-dotenv

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not integration and not slow"

  # =========================================================================
  # Build & Push Images
  # =========================================================================
  build-push:
    name: "Build & Push Docker Images"
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API image
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag

      - name: Extract metadata for Worker image
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # =========================================================================
  # SBOM Generation (optional, using syft)
  # =========================================================================
  sbom:
    name: "Generate SBOM"
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - uses: actions/checkout@v4

      - name: Install syft
        uses: anchore/sbom-action@v0
        with:
          artifact-name: drawio-automation-platform-sbom.spdx.json

      - name: Generate SBOM for API image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.ref_name }}
          output-file: api-sbom.spdx.json

      - name: Generate SBOM for Worker image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:${{ github.ref_name }}
          output-file: worker-sbom.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: |
            api-sbom.spdx.json
            worker-sbom.spdx.json

  # =========================================================================
  # Create GitHub Release
  # =========================================================================
  release-notes:
    name: "Create Release"
    runs-on: ubuntu-latest
    needs: [build-push]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          echo "## Release ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "### Docker Images" >> release-notes.md
          echo "- \`${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.ref_name }}\`" >> release-notes.md
          echo "- \`${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:${{ github.ref_name }}\`" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Changes" >> release-notes.md
          git log --oneline $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~1)..HEAD >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true