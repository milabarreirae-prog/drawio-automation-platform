# ============================================================================
# Stencils Update Workflow — Weekly Stencil Fetch & Auto PR
# ============================================================================
# Runs:
#   - Every Monday at 06:00 UTC (weekly)
#   - Manual trigger (workflow_dispatch)
#
# Actions:
#   1. Run fetch_stencils.py to download latest stencil libraries
#   2. Check for changes (diff)
#   3. If stencils changed, create an automated PR
# ============================================================================

name: Weekly Stencils Update

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force_recreate:
        description: "Force recreate all stencils (--force flag)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-stencils:
    name: "Update Stencil Libraries"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch stencils
        id: fetch
        run: |
          FETCH_ARGS=""
          if [ "${{ inputs.force_recreate }}" = "true" ]; then
            FETCH_ARGS="--force"
          fi
          python scripts/fetch_stencils.py $FETCH_ARGS --log-level INFO
        continue-on-error: true

      - name: Check for changes
        id: git_diff
        run: |
          git add stencils/downloaded/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ No stencil changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📊 Stencil changes detected:"
            git diff --cached --stat
          fi

      - name: Run license verification
        if: steps.git_diff.outputs.changed == 'true'
        run: python scripts/verify_licenses.py --check-strict

      - name: Create Pull Request with updated stencils
        if: steps.git_diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(stencils): update stencil libraries (automated)

          Automated weekly stencil library update via fetch_stencils.py.

          Changes:
          - Updated stencil XML files in stencils/downloaded/
          - Updated metadata files with new SHA256 hashes
          - Updated fetch_report.json

          Generated by: .github/workflows/stencils-update.yml"
          title: "chore(stencils): automated stencil library update"
          body: |
            ## 🤖 Automated Stencil Library Update

            This PR updates stencil libraries to their latest versions.

            **Trigger:** Weekly cron job (Monday 06:00 UTC) or manual dispatch

            **Changes include:**
            - Updated stencil XML files in `stencils/downloaded/`
            - Updated metadata files with new SHA256 hashes
            - Updated `fetch_report.json` with download summary

            ### Review Checklist
            - [ ] Verify license compatibility with `scripts/verify_licenses.py`
            - [ ] Check for breaking changes in stencil shapes
            - [ ] Test rendering with updated stencils

            ---
            *Generated by [stencils-update workflow](.github/workflows/stencils-update.yml)*
          branch: "automated/stencils-update"
          base: "main"
          labels: |
            automated
            stencils
            dependencies
          delete-branch: true
          reviewers: |
            ${{ github.repository_owner }}
          assignees: |
            ${{ github.repository_owner }}