name: Python Platform CI

on:
  push:
    branches:
      - v1.x
      - port/**
    paths:
      - "api/**"
      - "worker/**"
      - "scripts/**"
      - "stencils/**"
      - "tests/test_api.py"
      - "tests/test_linting.py"
      - "tests/test_stencils_loader.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - ".env.example"
      - "docker/Dockerfile.api"
      - "docker/Dockerfile.worker"
      - "docker/docker-compose.yml"
      - "docker/worker-entrypoint.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - v1.x
    paths:
      - "api/**"
      - "worker/**"
      - "scripts/**"
      - "stencils/**"
      - "tests/test_api.py"
      - "tests/test_linting.py"
      - "tests/test_stencils_loader.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - ".env.example"
      - "docker/Dockerfile.api"
      - "docker/Dockerfile.worker"
      - "docker/docker-compose.yml"
      - "docker/worker-entrypoint.sh"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -r api/requirements.txt -r worker/requirements.txt

      - name: Ruff lint
        run: |
          ruff check api worker scripts tests

      - name: Run focused platform tests
        run: |
          pytest tests/test_linting.py tests/test_stencils_loader.py tests/test_api.py -v --tb=short

  docker-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate docker compose config
        run: |
          docker compose -f docker/docker-compose.yml config > /dev/null
