# ============================================================================
# CI Workflow — Lint, Test, License Check, Docker Build
# ============================================================================
# Triggers:
#   - Push to main/develop branches
#   - Pull requests to main/develop
#
# Jobs:
#   1. lint — Ruff linting (Python)
#   2. test — Pytest with coverage
#   3. license-check — Verify stencil licenses
#   4. docker-build — Multi-architecture Docker builds (dry-run on PRs)
# ============================================================================

name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # =========================================================================
  # Lint — Ruff static analysis
  # =========================================================================
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff lint
        run: ruff check api/ worker/ tests/ scripts/

      - name: Run ruff format check
        run: ruff format --check api/ worker/ tests/ scripts/

  # =========================================================================
  # Test — Pytest with coverage
  # =========================================================================
  test:
    name: "Test (pytest)"
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "pytest>=8.2" "pytest-asyncio>=0.21" "pytest-cov>=5.0" "pytest-mock>=3.14" "httpx>=0.27"
          pip install -e ".[dev]"
          # Install runtime deps without extras
          pip install fastapi uvicorn arq redis lxml boto3 pydantic pydantic-settings python-dotenv

      - name: Run tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --strict-markers \
            --cov=api \
            --cov=worker \
            --cov-report=term-missing \
            --cov-report=xml \
            -m "not integration and not slow"

      - name: Upload coverage to Codecov (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # =========================================================================
  # License Check — Verify stencil license compatibility
  # =========================================================================
  license-check:
    name: "License Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run license verification
        run: python scripts/verify_licenses.py --check-strict

      - name: Check LICENSE exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "❌ LICENSE file is missing!"
            exit 1
          fi
          echo "✅ LICENSE file present"

      - name: Check NOTICE exists
        run: |
          if [ ! -f NOTICE ]; then
            echo "❌ NOTICE file is missing!"
            exit 1
          fi
          echo "✅ NOTICE file present"

  # =========================================================================
  # Docker Build — Multi-architecture build check
  # =========================================================================
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (check only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image (check only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max